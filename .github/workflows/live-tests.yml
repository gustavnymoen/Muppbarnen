# Tester mot den riktiga sajten efter varje publicering.
# Bara rökproven (npm run test:smoke): de läser bara, behöver inga
# hemligheter och skriver aldrig testdata i produktionen. Startar när Vercel
# meddelar att en produktionsdeploy är klar (deployment_status), och kan också
# startas för hand under Actions → Live tests.
name: Live tests

on:
  deployment_status:
  workflow_dispatch:

# GITHUB_TOKEN får bara läsa
permissions:
  contents: read

jobs:
  # Vercel skickar deployment_status för förhandsversionerna också; de hoppas
  # över här och syns som ett överhoppat "live" på pull requesten
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Playwrights image, samma version som @playwright/test
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      # Testerna från samma commit som publicerades
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: ./.github/actions/setup-tests

      # Mot sajtens fasta adress (standard i playwright.config.ts)
      - run: npm run test:smoke

      - name: Spara testrapporten
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-live
          path: |
            playwright-report/
            test-results/
          retention-days: 14
